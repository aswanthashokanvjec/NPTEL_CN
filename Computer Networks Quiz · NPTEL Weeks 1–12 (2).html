const N=30;
const SECS=[["Mixed quiz",N]];
const app=document.getElementById("app");
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const prep=r=>{const o=r[2].split("|").map((t,i)=>({t,c:i===r[3]}));return{w:r[0],q:r[1],o:sh(o)}};
let S;
function home(){
 app.innerHTML=`<h1>Computer Networks Quiz</h1><p class="sub">NPTEL Weeks 1–12 · 30 questions per quiz, drawn from a bank of ${Q.length} questions. Every attempt is shuffled.</p>
 <div class="card"><b>Mixed quiz · 30 questions · 30 marks</b><p class="sub" style="margin:6px 0 14px">Random questions from all 12 weeks.</p>
 <button class="btn" id="go">Start mixed quiz</button></div>
 <h2>Week-wise quiz · 30 questions each</h2><div class="weeks">${[...Array(12)].map((_,i)=>`<button class="wk" data-w="${i+1}"><b>Week ${i+1}</b><span>${Q.filter(x=>x[0]==i+1).length} in bank</span></button>`).join("")}</div>`;
 document.getElementById("go").onclick=()=>start(sh(Q).slice(0,N),SECS,"Mixed quiz");
 app.querySelectorAll(".wk").forEach(b=>b.onclick=()=>{const w=+b.dataset.w;start(sh(Q.filter(x=>x[0]==w)).slice(0,N),[["Week "+w,N]],"Week "+w)});
}
function start(rows,secs,name){S={qs:rows.map(prep),secs,name,i:0,ans:[],score:0};show()}
function secOf(i){let n=0;for(const s of S.secs){n+=s[1];if(i<n)return s[0]}return S.secs[S.secs.length-1][0]}
function show(){
 const n=S.qs.length,q=S.qs[S.i];
 app.innerHTML=`<div class="top"><span class="chip">${secOf(S.i)}</span><span>Question ${S.i+1} of ${n} · Week ${q.w} · ${S.score} correct</span></div>
 <div class="bar"><i style="width:${S.i/n*100}%"></i></div>
 <div class="card q"><h3>${q.q}</h3>${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><em>${"ABCD"[k]}</em><span>${o.t}</span></button>`).join("")}
 <div class="foot"><button class="btn hide" id="nx">${S.i==n-1?"See results":"Next question"}</button></div></div>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 requestAnimationFrame(()=>app.querySelector(".bar i").style.width=(S.i/n*100)+"%");
}
function pick(k){
 const q=S.qs[S.i],bs=app.querySelectorAll(".opt"),right=q.o[k].c;
 bs.forEach((b,j)=>{b.disabled=true;if(q.o[j].c)b.classList.add("ok");else if(j===k)b.classList.add("no")});
 if(right)S.score+=1;S.ans.push(right);
 const nx=document.getElementById("nx");nx.classList.remove("hide");
 nx.onclick=()=>{S.i++;S.i<S.qs.length?show():done()};
 nx.focus();
}
function done(){
 const n=S.qs.length,tot=n,pct=Math.round(S.score/tot*100);
 let off=0;const rows=S.secs.map(s=>{const c=Math.min(s[1],n-off),a=S.ans.slice(off,off+c).filter(Boolean).length;off+=c;return[s[0],a,c]});
 const wrong=S.qs.map((q,i)=>[q,i]).filter(x=>!S.ans[x[1]]);
 app.innerHTML=`<div class="card score"><div class="chip" style="display:inline-block">${S.name}</div><div class="big">${S.score}/${tot}</div>
 <p class="sub">${pct}% · ${pct>=80?"Excellent work.":pct>=50?"Good progress. Review the misses below.":"Keep practising. Review the answers below."}</p>
 ${S.secs.length>1?`<div class="secs">${rows.map(r=>`<div class="sec"><b>${r[1]}/${r[2]}</b><span>${r[0]}</span></div>`).join("")}</div>`:""}
 <button class="btn" id="re">Try again (new shuffle)</button> <button class="btn alt" id="hm">Home</button></div>
 <h2>${wrong.length?"Review: "+wrong.length+" missed":"No mistakes. Perfect score."}</h2>
 ${wrong.map(([q])=>`<div class="rv"><b>Week ${q.w}:</b> ${q.q}<br><span>Answer: ${q.o.find(o=>o.c).t}</span></div>`).join("")}`;
 document.getElementById("hm").onclick=home;
 document.getElementById("re").onclick=()=>S.name=="Mixed quiz"?start(sh(Q).slice(0,N),SECS,"Mixed quiz"):start(sh(Q.filter(x=>"Week "+x[0]==S.name)).slice(0,N),S.secs,S.name);
}
home();
</script></body></html>
